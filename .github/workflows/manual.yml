name: Manual Python Playwright

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON(format('["{0}"]', github.event.inputs.browser || 'chromium')) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright Browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Create output folders
        run: |
          mkdir -p allure-results
          mkdir -p test-results

      - name: Run pytest suite
        run: |
          python -m pytest pytests/specs \
            --browser=${{ matrix.browser }} \
            --alluredir=allure-results \
            --junitxml=test-results/junit-python.xml \
            -q
        env:
          CI: true

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-python-junit-${{ matrix.browser }}
          path: test-results/junit-python.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-python-allure-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-python-failures-${{ matrix.browser }}
          path: |
            test-results/artifacts/
            test-results/videos/
          retention-days: 14
          if-no-files-found: ignore
