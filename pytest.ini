[pytest]
testpaths = pytests/specs
python_files = test_*.py
addopts = -ra --strict-markers --dist=loadscope -n auto
markers =
    smoke: Smoke test coverage.
    regression: Regression test coverage.
    authentication: Authentication tests.
    user_registration: User registration tests.
    products: Product catalog tests.
    python_migration: Tests migrated from TypeScript.
    quarantine: Temporarily unstable tests excluded from blocking checks.
    slow: Slow-running tests for nightly execution.
