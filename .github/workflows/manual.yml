name: Manual Python Playwright

env:
  HEADLESS: 'true'
  ENABLE_TESTOPS_UPLOAD: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'TOKEN')] != '' && secrets[format('ALLURE_TESTOPS_{0}', 'ENDPOINT')] != '' && secrets[format('ALLURE_TESTOPS_{0}', 'PROJECT_ID')] != '' }}
  ALLURE_TESTOPS_ENABLED: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'ENABLED')] }}

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON(format('["{0}"]', github.event.inputs.browser || 'chromium')) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install allurectl (optional)
        if: ${{ env.ENABLE_TESTOPS_UPLOAD == 'true' }}
        run: |
          curl -fsSL -o allurectl https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
          chmod +x allurectl
          sudo mv allurectl /usr/local/bin/allurectl
          allurectl --version

      - name: Install Playwright Browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Create output folders
        run: |
          rm -rf test-results/artifacts
          rm -rf test-results/videos
          rm -rf test-results/failure-evidence
          mkdir -p allure-results
          mkdir -p test-results
          mkdir -p test-results/artifacts
          mkdir -p test-results/videos
          mkdir -p test-results/videos/${{ matrix.browser }}

      - name: Run pytest suite
        run: |
          python -m pytest pytests/specs \
            --browser=${{ matrix.browser }} \
            --alluredir=allure-results \
            --junitxml=test-results/junit-python.xml \
            -q
        env:
          CI: true

      - name: Upload manual raw results to Allure TestOps (optional)
        if: always()
        continue-on-error: true
        env:
          ALLURE_ENDPOINT: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'ENDPOINT')] }}
          ALLURE_TOKEN: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'TOKEN')] }}
          ALLURE_PROJECT_ID: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'PROJECT_ID')] }}
          ALLURE_LAUNCH_NAME: python-manual-${{ matrix.browser }}-${{ github.ref_name }}-${{ github.run_number }}
        run: |
          ENABLED_VALUE="${ALLURE_TESTOPS_ENABLED:-true}"

          if [ "${ENABLE_TESTOPS_UPLOAD}" != "true" ] || [ "${ENABLED_VALUE}" = "false" ]; then
            echo "Allure TestOps upload skipped (missing secrets)."
            exit 0
          fi

          if [ ! -d "allure-results" ]; then
            echo "Allure results folder not found, skipping upload."
            exit 0
          fi

          printf "%s\n" \
            "workflow=${{ github.workflow }}" \
            "event=${{ github.event_name }}" \
            "branch=${{ github.ref_name }}" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "run_number=${{ github.run_number }}" \
            "browser=${{ matrix.browser }}" \
            "trigger=manual" \
            "repository=${{ github.repository }}" \
            > allure-results/environment.properties

          allurectl upload allure-results

      - name: Generate manual test summary
        if: always()
        run: |
          python scripts/summarize_junit.py \
            --input test-results/junit-python.xml \
            --output-json test-results/summary.json \
            --output-md test-results/summary.md \
            --title "Manual Python Summary (${{ matrix.browser }})" \
            --github-summary

      - name: Summarize manual failure evidence
        if: always()
        run: |
          python scripts/summarize_failure_evidence.py \
            --artifacts-dir test-results/artifacts \
            --videos-dir test-results/videos \
            --output-json test-results/evidence-summary.json \
            --output-md test-results/evidence-summary.md \
            --title "Manual Failure Evidence (${{ matrix.browser }})" \
            --github-summary

      - name: Build clean manual failure evidence bundle
        if: always()
        run: |
          python scripts/prepare_failure_evidence_bundle.py \
            --artifacts-dir test-results/artifacts \
            --videos-dir test-results/videos \
            --bundle-dir test-results/failure-evidence \
            --output-json test-results/evidence-bundle.json \
            --output-md test-results/evidence-bundle.md \
            --title "Manual Failure Evidence Bundle (${{ matrix.browser }})" \
            --github-summary

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-python-junit-${{ matrix.browser }}
          path: |
            test-results/junit-python.xml
            test-results/summary.json
            test-results/summary.md
            test-results/evidence-summary.json
            test-results/evidence-summary.md
            test-results/evidence-bundle.json
            test-results/evidence-bundle.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-python-allure-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-python-failures-${{ matrix.browser }}
          path: test-results/failure-evidence/
          retention-days: 14
          if-no-files-found: ignore
