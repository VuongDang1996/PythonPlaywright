name: Python Pytest Automation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'pytests/**'
      - 'features/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'pytest.ini'
      - '.github/workflows/python-pytest.yml'
      - '.github/workflows/python-pytest-nightly.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pytests/**'
      - 'features/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'pytest.ini'
      - '.github/workflows/python-pytest.yml'
      - '.github/workflows/python-pytest-nightly.yml'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      parallel_workers:
        description: 'Number of pytest workers (auto or integer)'
        required: false
        default: 'auto'
        type: string
      test_scope:
        description: 'Test scope for dispatch runs'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: python-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  BASE_URL: 'https://automationexercise.com'
  HEADLESS: 'true'
  BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
  PARALLEL_WORKERS: ${{ github.event.inputs.parallel_workers || 'auto' }}
  TEST_SCOPE: ${{ github.event.inputs.test_scope || (github.event_name == 'pull_request' && 'smoke' || 'full') }}
  BDD_TAGS: ${{ (github.event.inputs.test_scope == 'smoke' && '@smoke') || (github.event_name == 'pull_request' && '@smoke' || '') }}
  ENABLE_TESTOPS_UPLOAD: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'TOKEN')] != '' && secrets[format('ALLURE_TESTOPS_{0}', 'ENDPOINT')] != '' && secrets[format('ALLURE_TESTOPS_{0}', 'PROJECT_ID')] != '' }}
  ALLURE_TESTOPS_ENABLED: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'ENABLED')] }}
  QUALITY_GATE_ENABLED: ${{ secrets[format('QUALITY_GATE_{0}', 'ENABLED')] }}
  QUALITY_GATE_MIN_PASS_RATE: ${{ secrets[format('QUALITY_GATE_{0}', 'MIN_PASS_RATE')] }}
  QUALITY_GATE_MAX_FAILED_TOTAL: ${{ secrets[format('QUALITY_GATE_{0}', 'MAX_FAILED_TOTAL')] }}
  QUALITY_GATE_MAX_FLAKY: ${{ secrets[format('QUALITY_GATE_{0}', 'MAX_FLAKY')] }}

jobs:
  test-python:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install allurectl (optional)
        if: ${{ env.ENABLE_TESTOPS_UPLOAD == 'true' }}
        run: |
          curl -fsSL -o allurectl https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
          chmod +x allurectl
          sudo mv allurectl /usr/local/bin/allurectl
          allurectl --version

      - name: Quality checks (ruff, black, mypy)
        run: |
          python -m ruff check pytests/config pytests/components pytests/pages pytests/data pytests/conftest.py
          python -m black --check pytests/config pytests/components pytests/pages pytests/data pytests/conftest.py
          python -m mypy pytests/config pytests/components pytests/pages pytests/data pytests/conftest.py

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${BROWSER}

      - name: Restore Allure history cache
        id: restore-allure-history
        uses: actions/cache/restore@v4
        with:
          path: .allure-history/${{ env.BROWSER }}
          key: allure-history-${{ github.ref_name }}-${{ env.BROWSER }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-${{ env.BROWSER }}-

      - name: Restore flaky trend cache
        id: restore-flaky-trend
        uses: actions/cache/restore@v4
        with:
          path: .ci-trends/${{ env.BROWSER }}
          key: flaky-trend-${{ github.ref_name }}-${{ env.BROWSER }}-${{ github.run_id }}
          restore-keys: |
            flaky-trend-${{ github.ref_name }}-${{ env.BROWSER }}-

      - name: Create output folders
        run: |
          rm -rf test-results/artifacts
          rm -rf test-results/videos
          rm -rf test-results/failure-evidence
          mkdir -p allure-results
          mkdir -p test-results
          mkdir -p test-results/artifacts
          mkdir -p test-results/videos
          mkdir -p test-results/videos/${BROWSER}
          mkdir -p .allure-history/${BROWSER}
          mkdir -p .ci-trends/${BROWSER}

      - name: Seed Allure history from cache
        run: |
          if [ -d ".allure-history/${BROWSER}/history" ]; then
            mkdir -p allure-results/history
            cp -R ".allure-history/${BROWSER}/history/." allure-results/history/
          fi

      - name: Run pytest suite
        run: |
          MARKER_ARGS=""
          if [ "${TEST_SCOPE}" = "smoke" ]; then
            MARKER_ARGS="-m smoke"
          fi

          python -m pytest pytests/specs \
            --browser=${BROWSER} \
            --alluredir=allure-results \
            --junitxml=test-results/junit-python.xml \
            -n ${PARALLEL_WORKERS} \
            ${MARKER_ARGS} \
            -q
        env:
          CI: true

      - name: Upload raw results to Allure TestOps (optional)
        if: always()
        continue-on-error: true
        env:
          ALLURE_ENDPOINT: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'ENDPOINT')] }}
          ALLURE_TOKEN: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'TOKEN')] }}
          ALLURE_PROJECT_ID: ${{ secrets[format('ALLURE_TESTOPS_{0}', 'PROJECT_ID')] }}
          ALLURE_LAUNCH_NAME: python-pytest-${{ env.BROWSER }}-${{ github.ref_name }}-${{ github.run_number }}
        run: |
          ENABLED_VALUE="${ALLURE_TESTOPS_ENABLED:-true}"

          if [ "${ENABLE_TESTOPS_UPLOAD}" != "true" ] || [ "${ENABLED_VALUE}" = "false" ]; then
            echo "Allure TestOps upload skipped (missing secrets)."
            exit 0
          fi

          if [ ! -d "allure-results" ]; then
            echo "Allure results folder not found, skipping upload."
            exit 0
          fi

          printf "%s\n" \
            "workflow=${{ github.workflow }}" \
            "event=${{ github.event_name }}" \
            "branch=${{ github.ref_name }}" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "run_number=${{ github.run_number }}" \
            "browser=${{ env.BROWSER }}" \
            "test_scope=${{ env.TEST_SCOPE }}" \
            "repository=${{ github.repository }}" \
            > allure-results/environment.properties

          allurectl upload allure-results

      - name: Generate test summary
        if: always()
        run: |
          python scripts/summarize_junit.py \
            --input test-results/junit-python.xml \
            --output-json test-results/summary.json \
            --output-md test-results/summary.md \
            --title "Python Pytest Summary (${BROWSER})" \
            --github-summary

      - name: Update flaky trend
        if: always()
        run: |
          python scripts/update_flaky_trend.py \
            --summary-json test-results/summary.json \
            --trend-file .ci-trends/${BROWSER}/flaky-trend.json \
            --output-json test-results/flaky-trend.json \
            --output-md test-results/flaky-trend.md \
            --max-runs 90 \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --workflow "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --browser "${BROWSER}" \
            --event "${{ github.event_name }}" \
            --github-summary

      - name: Summarize failure evidence
        if: always()
        run: |
          python scripts/summarize_failure_evidence.py \
            --artifacts-dir test-results/artifacts \
            --videos-dir test-results/videos \
            --output-json test-results/evidence-summary.json \
            --output-md test-results/evidence-summary.md \
            --title "Failure Evidence (${BROWSER})" \
            --github-summary

      - name: Build clean failure evidence bundle
        if: always()
        run: |
          python scripts/prepare_failure_evidence_bundle.py \
            --artifacts-dir test-results/artifacts \
            --videos-dir test-results/videos \
            --bundle-dir test-results/failure-evidence \
            --output-json test-results/evidence-bundle.json \
            --output-md test-results/evidence-bundle.md \
            --title "Failure Evidence Bundle (${BROWSER})" \
            --github-summary

      - name: Setup Java for Allure
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure-2.24.0.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: python-pytest/latest
          keep_files: true

      - name: Add report links to job summary
        if: always()
        run: |
          echo "## Python Allure Report" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- Live report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/python-pytest/latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Artifact: python-pytest-allure-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      - name: Persist Allure history cache payload
        if: always()
        run: |
          mkdir -p .allure-history/${BROWSER}/history
          if [ -d allure-report/history ]; then
            rm -rf .allure-history/${BROWSER}/history
            mkdir -p .allure-history/${BROWSER}/history
            cp -R allure-report/history/. .allure-history/${BROWSER}/history/
          fi

      - name: Save Allure history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .allure-history/${{ env.BROWSER }}
          key: allure-history-${{ github.ref_name }}-${{ env.BROWSER }}-${{ github.run_id }}

      - name: Save flaky trend cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ci-trends/${{ env.BROWSER }}
          key: flaky-trend-${{ github.ref_name }}-${{ env.BROWSER }}-${{ github.run_id }}

      - name: Enforce optional quality gate
        if: always()
        run: |
          python scripts/enforce_quality_gate.py \
            --summary-json test-results/summary.json \
            --trend-json test-results/flaky-trend.json \
            --enabled "${QUALITY_GATE_ENABLED:-false}" \
            --min-pass-rate "${QUALITY_GATE_MIN_PASS_RATE:-95}" \
            --max-failed-total "${QUALITY_GATE_MAX_FAILED_TOTAL:-0}" \
            --max-flaky "${QUALITY_GATE_MAX_FLAKY:-5}" \
            --output-md test-results/quality-gate.md

      - name: Comment PR with python summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- python-pytest-summary -->';
            let summary = 'Summary unavailable.';
            let trend = '';
            let evidence = '';
            let qualityGate = '';
            try { summary = fs.readFileSync('test-results/summary.md', 'utf8'); } catch (_) {}
            try { trend = fs.readFileSync('test-results/flaky-trend.md', 'utf8'); } catch (_) {}
            try { evidence = fs.readFileSync('test-results/evidence-summary.md', 'utf8'); } catch (_) {}
            try { qualityGate = fs.readFileSync('test-results/quality-gate.md', 'utf8'); } catch (_) {}

            const body = `${marker}\n## Python CI Summary (${process.env.BROWSER || 'chromium'})\n\n${summary}\n${trend}\n${evidence}\n${qualityGate}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload JUnit and summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-metrics-${{ github.run_number }}
          path: |
            test-results/junit-python.xml
            test-results/summary.json
            test-results/summary.md
            test-results/flaky-trend.json
            test-results/flaky-trend.md
            test-results/evidence-summary.json
            test-results/evidence-summary.md
            test-results/evidence-bundle.json
            test-results/evidence-bundle.md
            test-results/quality-gate.md
          retention-days: 90

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-allure-${{ github.run_number }}
          path: |
            allure-results/
          retention-days: 30

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-failures-${{ github.run_number }}
          path: test-results/failure-evidence/
          retention-days: 14
          if-no-files-found: ignore

  test-behave:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${BROWSER}

      - name: Create Behave output folders
        run: |
          mkdir -p test-results/behave-junit

      - name: Run Behave suite
        run: |
          if [ -n "${BDD_TAGS}" ]; then
            echo "Running Behave with tags: ${BDD_TAGS}"
            python -m behave features --tags "${BDD_TAGS}" --junit --junit-directory test-results/behave-junit | tee test-results/behave-output.txt
          else
            echo "Running full Behave suite"
            python -m behave features --junit --junit-directory test-results/behave-junit | tee test-results/behave-output.txt
          fi
        env:
          CI: true

      - name: Generate Behave summary
        if: always()
        run: |
          python scripts/summarize_junit.py \
            --input test-results/behave-junit \
            --output-json test-results/behave-summary.json \
            --output-md test-results/behave-summary.md \
            --title "Behave BDD Summary (${BROWSER})" \
            --github-summary

      - name: Upload Behave artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-bdd-results-${{ github.run_number }}
          path: |
            test-results/behave-junit/
            test-results/behave-output.txt
            test-results/behave-summary.json
            test-results/behave-summary.md
          retention-days: 30
          if-no-files-found: ignore
